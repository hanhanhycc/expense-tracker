<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE4EC" />
      <stop offset="100%" stop-color="#FFC2D4" />
    </linearGradient>
    <radialGradient id="pigBody" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#FFA8C0" />
      <stop offset="60%" stop-color="#F783A8" />
      <stop offset="100%" stop-color="#D8557E" />
    </radialGradient>
    <radialGradient id="pigSnout" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FFB8CC" />
      <stop offset="100%" stop-color="#E66B92" />
    </radialGradient>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="55%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#C28B0E" />
    </radialGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.4">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Soft floor shadow -->
  <ellipse cx="256" cy="430" rx="160" ry="14" fill="#000" opacity="0.06" />

  <!-- Pig body -->
  <g transform="translate(256 290)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="170" ry="135" fill="url(#pigBody)" />
    <!-- Belly highlight -->
    <ellipse cx="-30" cy="20" rx="120" ry="85" fill="#FFFFFF" opacity="0.18" />
    <!-- Top shine -->
    <ellipse cx="-50" cy="-70" rx="90" ry="40" fill="url(#shine)" />

    <!-- Ears -->
    <path d="M-110 -100 L-70 -150 L-40 -90 Z" fill="#E66B92" />
    <path d="M50 -110 L100 -150 L120 -90 Z" fill="#E66B92" />
    <!-- Inner ears -->
    <path d="M-95 -110 L-72 -135 L-58 -100 Z" fill="#FFB8CC" opacity="0.7" />
    <path d="M68 -118 L92 -140 L108 -100 Z" fill="#FFB8CC" opacity="0.7" />

    <!-- Snout -->
    <ellipse cx="0" cy="20" rx="65" ry="48" fill="url(#pigSnout)" />
    <ellipse cx="-22" cy="20" rx="9" ry="14" fill="#5a2640" />
    <ellipse cx="22" cy="20" rx="9" ry="14" fill="#5a2640" />

    <!-- Eyes -->
    <circle cx="-55" cy="-35" r="13" fill="#2a1a1a" />
    <circle cx="-50" cy="-40" r="4.5" fill="#FFFFFF" />
    <circle cx="55" cy="-35" r="13" fill="#2a1a1a" />
    <circle cx="60" cy="-40" r="4.5" fill="#FFFFFF" />

    <!-- Cheeks blush -->
    <ellipse cx="-90" cy="20" rx="18" ry="11" fill="#FF6F95" opacity="0.45" />
    <ellipse cx="90" cy="20" rx="18" ry="11" fill="#FF6F95" opacity="0.45" />

    <!-- Legs -->
    <rect x="-100" y="100" width="40" height="42" rx="14" fill="#D8557E" />
    <rect x="60" y="100" width="40" height="42" rx="14" fill="#D8557E" />

    <!-- Coin slot on top -->
    <rect x="-40" y="-128" width="80" height="14" rx="7" fill="#5a2640" opacity="0.7" />

    <!-- Tail -->
    <path d="M165 0 q30 -8 28 -38 q-2 -28 -32 -22" fill="none" stroke="#D8557E" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Gold coin going into slot -->
  <g transform="translate(256 100)">
    <ellipse cx="0" cy="6" rx="56" ry="10" fill="#000" opacity="0.08" />
    <circle cx="0" cy="0" r="48" fill="url(#coin)" stroke="#9C6E0A" stroke-width="3" />
    <text x="0" y="18" font-family="system-ui, -apple-system, Segoe UI" font-size="56" font-weight="900" fill="#7a5400" text-anchor="middle">$</text>
    <ellipse cx="-15" cy="-18" rx="14" ry="6" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>
